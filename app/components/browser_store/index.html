<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Minimal Streamlit component: keeps a JSON value in this browser's localStorage.
// Args: action ("get" | "set" | "clear"), store_key, value, nonce. Returns {nonce, value}.
// Speaks the Streamlit component message protocol directly (no npm build step).
(function () {
  function send(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra), "*");
  }
  function read(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }  // storage blocked (private mode) or corrupt
  }
  var lastNonce = null;
  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    if (args.nonce === lastNonce) return;  // same request re-rendered: nothing new to do
    lastNonce = args.nonce;
    var key = "simguard:" + (args.store_key || "default");
    var ok = true;
    try {
      if (args.action === "set") window.localStorage.setItem(key, JSON.stringify(args.value));
      if (args.action === "clear") window.localStorage.removeItem(key);
    } catch (e) { ok = false; }
    send("streamlit:setComponentValue", { value: { nonce: args.nonce, value: read(key), ok: ok }, dataType: "json" });
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
